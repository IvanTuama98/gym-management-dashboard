{% extends "layout.html" %}

{% block title %} {{ get_text('register-payment') }} {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm p-4">
                <h3 class="text-center mb-1">{{ get_text('register-payment') }}</h3>
                <p class="text-center text-muted mb-4">{{ get_text('register-payment-p') }}</p>

                <form action="/add_payment" method="POST">
                    <!-- Client Selector -->
                    <div class="mb-3">
                        <label for="client_id" class="form-label fw-bold">{{ get_text('client') }}</label>
                        <select name="client_id" id="client_id" class="form-select" required>
                            <option value="" disabled {% if not selected_client_id %}selected{% endif %}>{{ get_text('select-client') }}</option>
                            {% for client in clients %}
                                <option value="{{ client[0] }}" {% if selected_client_id and selected_client_id == client[0] %}selected{% endif %}>
                                    {{ client[1] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Input for the amount to charge -->
                    <div class="mb-3">
                        <label for="amount" class="form-label fw-bold">{{ get_text('amount-charge') }}</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" name="amount" id="amount" value="{{ "%.2f"|format(suggested_amount) }}" required>
                        </div>
                        <div class="form-text">{{ get_text('suggested_fee') }}</div>
                    </div>

                    <!-- Confirm and cancel buttons -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success fw-bold">{{ get_text('confirm-payment') }}</button>
                        <a href="/clients" class="btn btn-outline-secondary">{{ get_text('cancel') }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
