{% extends "layout.html" %}

{% block title %} {{ get_text('add-client') }} {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm p-4">
                <h3 class="text-center mb-4">{{ get_text('add-client') }}</h3>

                <form action="/clients/add" method="POST">
                    <div class="form-group">
                        <label for="name">{{ get_text('name') }}</label>
                        <input class="form-control mb-3" type="text" name="name">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">{{ get_text('phone') }}</label>
                        <input class="form-control mb-3" type="number" name="phone">
                    </div>

                    <button class="btn btn-dark" type="submit">{{ get_text('submit') }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
