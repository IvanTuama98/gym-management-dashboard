{% extends "layout.html" %}

{% block title %} Settings {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm p-4">
                <h3 class="text-center mb-4">{{ get_text('settings-title') }}</h3>

                <form action="/settings" method="POST">
                    <div class="form-group">
                        <label for="monthly_fee">Monthly fee:</label>
                        <input class="form-control mb-3" type="number" name="monthly_fee" value="{{ settings.monthly_fee | default(0) }}">
                        <label for="due_day">Due day:</label>
                        <input class="form-control mb-3" type="number" name="due_day" value="{{ settings.due_day | default(15) }}">
                        <label for="late_fee">Late fee:</label>
                        <input class="form-control mb-3" type="number" name="late_fee" value="{{ settings.late_fee | default(0) }}">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Save changes</button>
                        <a href="/" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
