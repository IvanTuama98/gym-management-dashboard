{% extends "layout.html" %}

{% block title %} Register {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm p-4">
                <h3 class="text-center mb-4">{{ get_text('register-form-title') }}</h3>

                <form action="/register" method="POST">
                    <div class="form-group">
                        <label for="username">{{ get_text('username') }}</label>
                        <input class="form-control mb-3" type="text" name="username">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">{{ get_text('password') }}</label>
                        <input class="form-control mb-3" type="password" name="password">
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">{{ get_text('confirm-password') }}:</label>
                        <input class="form-control mb-3" type="password" name="confirm-password">
                    </div>

                    <button class="btn btn-dark" type="submit">{{ get_text('register-btn') }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
